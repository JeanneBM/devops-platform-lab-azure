name: Jenkins dynamic agent verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  jenkins:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Jenkins fetches published branch commits, not GitHub's synthetic PR merge.
      LAB_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
          kind create cluster --name jenkins-lab-ci --config ci/kind.yaml --kubeconfig "$RUNNER_TEMP/jenkins.kubeconfig" --wait 180s
      - name: Build and deploy the real applications for the complete lab test
        shell: pwsh
        run: |
          $kube = Join-Path $env:RUNNER_TEMP 'jenkins.kubeconfig'
          docker build -t devops-platform-lab-azure/pycalculator:ci src/python
          if ($LASTEXITCODE -ne 0) { throw 'Python image build failed.' }
          docker build -t devops-platform-lab-azure/g4g7singleton:ci src/java
          if ($LASTEXITCODE -ne 0) { throw 'Java image build failed.' }
          kind load docker-image --name jenkins-lab-ci devops-platform-lab-azure/pycalculator:ci devops-platform-lab-azure/g4g7singleton:ci
          if ($LASTEXITCODE -ne 0) { throw 'Image load failed.' }
          ./scripts/Deploy-Applications.ps1 -Registry devops-platform-lab-azure -ImageTag ci -Kubeconfig $kube
      - name: Install pinned Jenkins and namespace-scoped permissions
        shell: pwsh
        run: |
          ./scripts/Deploy-Jenkins.ps1 -Kubeconfig (Join-Path $env:RUNNER_TEMP 'jenkins.kubeconfig') -SourceRef $env:LAB_SOURCE_REF -StorageClass standard
      - name: Prove RBAC, shared library, real dynamic agent build and cleanup
        shell: pwsh
        run: |
          ./scripts/Test-Jenkins.ps1 -Kubeconfig (Join-Path $env:RUNNER_TEMP 'jenkins.kubeconfig') -PluginExport (Join-Path $env:RUNNER_TEMP 'jenkins-plugins.txt')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jenkins-plugins
          path: ${{ runner.temp }}/jenkins-plugins.txt
      - name: Backup offline and restore to a new PVC
        shell: pwsh
        run: |
          ./scripts/Test-JenkinsRecovery.ps1 -Kubeconfig (Join-Path $env:RUNNER_TEMP 'jenkins.kubeconfig') -SourceRef $env:LAB_SOURCE_REF -StorageClass standard
      - name: Verify the full lab after Jenkins recovery, including outage and alert resolution
        shell: pwsh
        run: |
          $kube = Join-Path $env:RUNNER_TEMP 'jenkins.kubeconfig'
          ./scripts/Deploy-Observability.ps1 -Kubeconfig $kube
          ./scripts/Test-Lab.ps1 -Kubeconfig $kube -ExerciseAlerts
      - name: Diagnostics without secrets
        if: failure()
        run: |
          kubectl --kubeconfig "$RUNNER_TEMP/jenkins.kubeconfig" get pods,pvc -A -o wide || true
          kubectl --kubeconfig "$RUNNER_TEMP/jenkins.kubeconfig" get events -A --sort-by=.lastTimestamp || true
          kubectl --kubeconfig "$RUNNER_TEMP/jenkins.kubeconfig" -n jenkins logs statefulset/jenkins -c init --tail=150 || true
          kubectl --kubeconfig "$RUNNER_TEMP/jenkins.kubeconfig" -n jenkins logs statefulset/jenkins -c jenkins --tail=150 || true
          for component in prometheus loki alloy grafana kube-state-metrics; do
            kubectl --kubeconfig "$RUNNER_TEMP/jenkins.kubeconfig" -n observability logs deployment/$component --tail=60 || true
          done
      - name: Remove CI cluster
        if: always()
        run: kind delete cluster --name jenkins-lab-ci

