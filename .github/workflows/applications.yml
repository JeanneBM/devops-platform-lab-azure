name: Application and Helm verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  applications:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - name: Test source and rendered Helm resources
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          bash scripts/test-java.sh
          helm lint charts/lab-app --values helm-values/python.yaml
          helm lint charts/lab-app --values helm-values/java.yaml
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - name: Build the real runtime images and create isolated CI cluster
        run: |
          docker build --platform linux/amd64 -t devops-platform-lab-azure/pycalculator:ci src/python
          docker build --platform linux/amd64 -t devops-platform-lab-azure/g4g7singleton:ci src/java
          kind create cluster --name azure-lab-ci --config ci/kind.yaml --kubeconfig "$RUNNER_TEMP/lab.kubeconfig" --wait 180s
          kind load docker-image --name azure-lab-ci devops-platform-lab-azure/pycalculator:ci devops-platform-lab-azure/g4g7singleton:ci
      - name: Deploy through PowerShell and verify HTTP behavior
        shell: pwsh
        run: |
          $kube = Join-Path $env:RUNNER_TEMP 'lab.kubeconfig'
          ./scripts/Deploy-Applications.ps1 -Registry devops-platform-lab-azure -ImageTag ci -Kubeconfig $kube
          ./scripts/Test-Applications.ps1 -Kubeconfig $kube
      - name: Install metrics, logging and dashboards
        shell: pwsh
        run: |
          $kube = Join-Path $env:RUNNER_TEMP 'lab.kubeconfig'
          kubectl --kubeconfig $kube create namespace jenkins
          kubectl --kubeconfig $kube create namespace jenkins-agents
          ./scripts/Deploy-Observability.ps1 -Kubeconfig $kube
      - name: Verify collected telemetry and deliberate outage alert recovery
        shell: pwsh
        run: |
          ./scripts/Test-Observability.ps1 -Kubeconfig (Join-Path $env:RUNNER_TEMP 'lab.kubeconfig') -ExerciseAlerts
      - name: Failure diagnostics
        if: failure()
        run: |
          kubectl --kubeconfig "$RUNNER_TEMP/lab.kubeconfig" get pods -A -o wide || true
          kubectl --kubeconfig "$RUNNER_TEMP/lab.kubeconfig" get events -A --sort-by=.lastTimestamp || true
          kubectl --kubeconfig "$RUNNER_TEMP/lab.kubeconfig" -n python logs deployment/pycalculator --tail=100 || true
          kubectl --kubeconfig "$RUNNER_TEMP/lab.kubeconfig" -n java logs deployment/g4g7singleton --tail=100 || true
          for component in prometheus loki alloy grafana kube-state-metrics; do
            kubectl --kubeconfig "$RUNNER_TEMP/lab.kubeconfig" -n observability logs deployment/$component --tail=60 || true
          done
      - name: Remove CI cluster
        if: always()
        run: kind delete cluster --name azure-lab-ci
