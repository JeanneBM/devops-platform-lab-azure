      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "kube-state-metrics",
          "app.kubernetes.io/part-of": "devops-lab-observability"
        }
      },
      "spec": {
        "serviceAccountName": "kube-state-metrics",
        "automountServiceAccountToken": true,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 65534,
          "runAsGroup": 65534,
          "fsGroup": 65534,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "kube-state-metrics",
            "image": "{{ .Values.images.kubeStateMetrics }}",
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "128Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ],
            "args": [
              "--namespaces=python,java,jenkins,jenkins-agents",
              "--resources=pods,deployments,statefulsets,persistentvolumeclaims"
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/readyz",
                "port": 8081
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 5,
              "failureThreshold": 24,
              "timeoutSeconds": 5
            }
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "64Mi"
            }
          }
        ]
      }
    }
  }
}
