{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "grafana",
    "namespace": "{{ .Release.Namespace }}"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "grafana",
        "app.kubernetes.io/part-of": "devops-lab-observability"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "grafana",
          "app.kubernetes.io/part-of": "devops-lab-observability"
        }
      },
      "spec": {
        "serviceAccountName": "default",
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 472,
          "runAsGroup": 472,
          "fsGroup": 472,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "grafana",
            "image": "{{ .Values.images.grafana }}",
            "ports": [
              {
                "name": "http",
                "containerPort": 3000
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "config",
                "mountPath": "/etc/grafana/provisioning/datasources/datasources.yml",
                "readOnly": true,
                "subPath": "datasources.yml"
              },
              {
                "name": "config",
                "mountPath": "/etc/grafana/provisioning/dashboards/dashboards.yml",
                "readOnly": true,
                "subPath": "dashboards.yml"
              },
              {
                "name": "config",
                "mountPath": "/var/lib/grafana/dashboards/lab.json",
                "readOnly": true,
                "subPath": "lab.json"
              },
              {
                "name": "data",
                "mountPath": "/var/lib/grafana"
              }
            ],
            "env": [
              {
                "name": "GF_SECURITY_ADMIN_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "grafana-admin",
                    "key": "password"
                  }
                }
              },
              {
                "name": "GF_USERS_ALLOW_SIGN_UP",
                "value": "false"
              },
              {
                "name": "GF_ANALYTICS_REPORTING_ENABLED",
                "value": "false"
              },
              {
                "name": "GF_ANALYTICS_CHECK_FOR_UPDATES",
                "value": "false"
              },
              {
                "name": "GF_LOG_MODE",
                "value": "console"
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": "http"
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 5,
              "failureThreshold": 24,
              "timeoutSeconds": 5
            }
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "64Mi"
            }
          },
          {
            "name": "config",
            "configMap": {
              "name": "lab-observability"
            }
          },
          {
            "name": "data",
            "emptyDir": {
              "sizeLimit": "256Mi"
            }
          }
        ]
      }
    }
  }
}
